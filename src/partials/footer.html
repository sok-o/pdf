{{#if simpleMode}} {{> footer-simple}} {{else}}
<footer class="mt-16 border-t-2 border-gray-700 py-8">
  <div class="container mx-auto px-4">
    <div class="flex flex-col items-center justify-center text-center">

      <!-- Logo / Brand -->
      <div class="flex items-center justify-center mb-4">
        <img
          id="footer-logo"
          src="{{baseUrl}}{{#if brandLogo}}{{brandLogo}}{{else}}images/favicon.svg{{/if}}"
          alt="{{#if brandName}}{{brandName}}{{else}}PDF Editor{{/if}} Logo"
          class="h-10 w-10 mr-3"
        />

        <span
          id="footer-brand"
          class="text-xl font-bold text-white"
        >
          {{#if brandName}}{{brandName}}{{else}}PDF Editor{{/if}}
        </span>
      </div>

      <!-- Copyright -->
      <p
        id="footer-copyright"
        class="text-gray-400 text-sm"
      >
        {{#if footerText}}
          {{footerText}}
        {{else}}
          &copy; 2026 PDF Editor. All rights reserved.
        {{/if}}
      </p>

      <!-- Version -->
      <p class="text-gray-400 text-xs mt-2">
        <span data-i18n="footer.version">Version</span>
        <span id="app-version">{{appVersion}}</span>
      </p>

    </div>
  </div>
</footer>
{{/if}}
